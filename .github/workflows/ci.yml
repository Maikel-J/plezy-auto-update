name: Android CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare-release-apks:
    name: Compare signed Plezy 2.25.0 APKs with 2.24.0
    if: ${{ github.repository == 'Maikel-J/plezy-auto-update' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dot/verify-signed-plezy-2-25-0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact signed production artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15038413947
          run-id: 45647768214
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Download production artifact used for the current public release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15023453282
          run-id: 45616108501
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Verify public asset digests, manifest versions, and all signer certificates
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.1.0' > /dev/null
          signer="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          manifest="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$signer"
          test -x "$manifest"
          (cd "$RUNNER_TEMP/candidate"; sha256sum --strict -c SHA256SUMS)
          sum_check() {
            printf '%s  %s\n' "$1" "$2" | sha256sum --strict --check
          }
          certs() {
            "$signer" verify --print-certs "$1" |
              sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' | sort
          }
          for entry in \
            'armeabi-v7a 1156 1158 56ef7e99a1b67cdc630d8775fd5c404f030ddce382c64b04e11a5f545cb929f2 437f8ec34a558270383999cb50c7f80597d922713f566e0bc9a2fabbf4ccc2b7' \
            'arm64-v8a 2156 2158 24c3c755d18e3990cdd64fd3b4e86e1a334c13b3bb1011e3c572c245bc05faac 367565d4c73e5ccff41c3c7f9863ad1921615d633bb5f375c56d913f9ae8f797' \
            'x86_64 4156 4158 759aa9e947569b9ee061632f0c27a4e3caa33f45856f0f5500feb78a63eb28ec -'; do
            read -r abi old_code new_code public_digest draft_digest <<< "$entry"
            file="plezy-android-$abi.apk"
            old="$RUNNER_TEMP/baseline/$file"
            new="$RUNNER_TEMP/candidate/$file"
            sum_check "$public_digest" "$old"
            if [[ "$draft_digest" != - ]]; then sum_check "$draft_digest" "$new"; fi
            test "$("$manifest" manifest application-id "$old")" = com.edde746.plezy
            test "$("$manifest" manifest application-id "$new")" = com.edde746.plezy
            test "$("$manifest" manifest version-name "$old")" = 2.24.0
            test "$("$manifest" manifest version-name "$new")" = 2.25.0
            test "$("$manifest" manifest version-code "$old")" = "$old_code"
            test "$("$manifest" manifest version-code "$new")" = "$new_code"
            old_certs="$(certs "$old")"
            new_certs="$(certs "$new")"
            test -n "$old_certs"
            test "$old_certs" = "$new_certs"
            echo "$abi: same app ID and signer certificate set, version code $old_code -> $new_code"
            sha256sum "$new"
          done
