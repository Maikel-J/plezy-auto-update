name: Android CI

# FORK POLICY: This maintained fork validates Android only. Do not re-add iOS,
# macOS, Linux, Windows, web, desktop packaging, or other platform CI jobs here.
# Shared codegen stays because the Android app depends on generated Dart source.
# Whole-repository analysis and all-locale translation hygiene are intentionally
# omitted because they can fail on non-Android concerns in this Android-only fork.

on:
  push:
    branches: [main]
  # Keep untrusted code on the read-only pull_request event. Never use pull_request_target here.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  android-ci:
    name: Sundock Android identity rehearsal
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dot/sundock-rebrand-rehearsal' && github.repository == 'Maikel-J/plezy-auto-update'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare exact upstream 2.26.0 without publishing
        id: prepare_release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/release/upstream_android.py "$RUNNER_TEMP/plezy-rehearsal.py"
          cp scripts/release/apply_sundock_identity.py "$RUNNER_TEMP/apply_sundock_identity.py"
          cp .github/workflows/ci.yml "$RUNNER_TEMP/autoplez-rehearsal-workflow.yml"
          git checkout --detach '64cfabe6dfc02b0e2b6e188e39bbf4867d40ed9d'
          test "$(git rev-parse HEAD)" = '64cfabe6dfc02b0e2b6e188e39bbf4867d40ed9d'
          git fetch --no-tags https://github.com/edde746/plezy.git refs/tags/2.26.0
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = '671a0d7b7bf7dacf37dc4a6086b6a9c0734904f7'
          test "$(git show FETCH_HEAD:pubspec.yaml | grep '^version:' | cut -d' ' -f2 | cut -d+ -f1)" = '2.26.0'
          cat > "$RUNNER_TEMP/plezy-rehearsal.json" <<'JSON'
          {"repository":"Maikel-J/plezy-auto-update","upstream_repository":"edde746/plezy","upstream_release_id":438618389,"upstream_tag":"2.26.0","upstream_published_at":"2026-11-09T01:46:46Z","upstream_url":"https://github.com/edde746/plezy/releases/tag/2.26.0","version":"2.26.0","release_tag":"v2.26.0+android.1","previous_build":158}
          JSON
          python3 "$RUNNER_TEMP/plezy-rehearsal.py" prepare --plan "$RUNNER_TEMP/plezy-rehearsal.json"
          python3 - "$RUNNER_TEMP/plezy-rehearsal.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan['upstream_sha'] == '671a0d7b7bf7dacf37dc4a6086b6a9c0734904f7', plan
          assert not plan.get('retry_tag'), plan
          assert plan['build_number'] == 161, plan
          assert plan['version'] == '2.26.0', plan
          print(f"Verified upstream source {plan['upstream_sha']}, Android build {plan['build_number']}")
          PY

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.prepare_release.outputs.flutter_version }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-android-pub-v1-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-gradle-v1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v1-

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Regenerate and commit release source in the runner
        run: |
          set -euo pipefail
          scripts/codegen.sh
          python3 "$RUNNER_TEMP/plezy-rehearsal.py" commit-source --plan "$RUNNER_TEMP/plezy-rehearsal.json"
          git merge-base --is-ancestor '671a0d7b7bf7dacf37dc4a6086b6a9c0734904f7' HEAD
          diff -u <(git ls-tree --name-only -r HEAD .github/workflows | sort) <(printf '%s\n' .github/workflows/{build,ci,sync-upstream,upstream-android}.yml | sort)
          grep -F -- '- worktrees/**' analysis_options.yaml
          grep -F -- '- packages/**/pigeons/**' analysis_options.yaml
          grep -F -- '- packages/**/test/**' analysis_options.yaml

      - name: Verify the upstream merge retained the updater before rebranding
        run: python3 -B -c 'import sys; sys.path.insert(0, "scripts/release"); import upstream_android; upstream_android.verify_updater()'

      - name: Apply the draft Sundock identity in the runner only
        run: python3 -B "$RUNNER_TEMP/apply_sundock_identity.py"

      - name: Regenerate and verify draft autoPlez source
        id: rebrand_source
        run: |
          set -euo pipefail
          scripts/codegen.sh
          git add -u
          git add assets/sundock_brand.svg android/app/src/main/res/drawable/sundock_launcher.xml android/app/src/main/res/drawable/sundock_tv_banner.xml
          # Preserve the actual controlling scripts with the build tree, outside
          # .github/workflows so the archived CI recipe is never interpreted as a trigger.
          mkdir -p scripts/release/rehearsal
          cp "$RUNNER_TEMP/apply_sundock_identity.py" scripts/release/rehearsal/
          cp "$RUNNER_TEMP/plezy-rehearsal.py" scripts/release/rehearsal/
          cp "$RUNNER_TEMP/autoplez-rehearsal-workflow.yml" scripts/release/rehearsal/
          git add scripts/release/rehearsal
          git -c user.name='Android rebrand rehearsal' -c user.email='android-rebrand-rehearsal@users.noreply.github.com' commit -m 'test(android): overlay draft autoPlez identity in isolated runner'
          test -z "$(git status --porcelain --untracked-files=no)"
          # The checker regenerates a temporary worktree of HEAD, not the working tree.
          scripts/codegen.sh --check
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run draft autoPlez link and separate feed regression tests
        run: |
          flutter test --dart-define=ANDROID_UPDATE_REPOSITORY=Maikel-J/plezy-auto-update \
            test/services/deep_links test/widgets/deep_link_dialog_test.dart \
            test/services/android_update_service_test.dart test/services/update_service_test.dart \
            test/screens/settings/logs_screen_test.dart test/widgets/startup_failure_view_test.dart \
            test/services/jellyfin_auth_header_test.dart test/services/jellyfin_client_urls_test.dart \
            test/services/plex_auth_service_test.dart

      - name: Inventory remaining old branding and upstream integrations
        run: |
          {
            echo 'Hosted endpoints / identity:'
            git grep -l -E 'ice[.]plezy[.]app|bugs[.]plezy[.]app|Plezy/|relay[.]plezy' -- lib android/app/src/main ':!lib/i18n' || true
            echo 'Visible Flutter assets:'
            git grep -l -E 'assets/plezy|assets/app_icons' -- lib pubspec.yaml ':!lib/i18n' || true
            echo 'Legacy Android launcher resource and alias paths:'
            git ls-files android/app/src/main/res | grep -E 'ic_launcher|tv_banner|app_icon' | sed -n '1,100p' || true
          }

      - name: Configure Android local properties
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties

      - name: Configure Android host native tests
        run: cmake -S android/app/src/test/cpp -B build/android-host-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build and run Android host native tests
        run: |
          cmake --build build/android-host-tests --parallel 2
          ctest --test-dir build/android-host-tests --output-on-failure --no-tests=error

      - name: Run production updater JVM tests
        working-directory: android
        env:
          # Robolectric's default Maven Central hostname returned HTTP 429 in CI.
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
        run: ./gradlew :app:testDebugUnitTest --tests 'com.edde746.plezy.AppUpdateChannelTest' -x :app:compileFlutterBuildDebug

      - name: Check Android API compatibility
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Assemble release APKs and verify updater packaging
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'Maikel-J/plezy-auto-update'
        env:
          BUILD_SOURCE_SHA: ${{ steps.rebrand_source.outputs.sha }}
        run: |
          set -euo pipefail
          # Candidate builds use neither the production key nor release permissions.
          test ! -e android/key.properties
          test "$(git rev-parse HEAD)" = "$BUILD_SOURCE_SHA"
          flutter build apk --release --split-per-abi \
            --dart-define=ENABLE_UPDATE_CHECK=true \
            --dart-define=GIT_COMMIT="$BUILD_SOURCE_SHA"
          export APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import zipfile
          import xml.etree.ElementTree as ET

          android = '{http://schemas.android.com/apk/res/android}'
          app_id = 'io.github.maikelj.sundock'
          expected_codes = {'arm64-v8a': '2161', 'armeabi-v7a': '1161', 'x86_64': '4161'}
          rehearsal_assets = []
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              apk = Path(f'build/app/outputs/flutter-apk/app-{abi}-release.apk')
              if not apk.is_file() or not apk.stat().st_size:
                  raise SystemExit(f'Missing release APK: {apk}')
              manifest = ET.fromstring(subprocess.check_output(
                  [os.environ['APKANALYZER'], 'manifest', 'print', str(apk)], text=True,
              ))
              with zipfile.ZipFile(apk) as archive:
                  packaged = set(archive.namelist())
              flutter_assets = 'assets/flutter_assets/assets/'
              if flutter_assets + 'sundock_brand.svg' not in packaged:
                  raise SystemExit(f'Missing replacement Flutter logo in {apk}')
              if any(flutter_assets + old in packaged for old in
                     ('plezy.png', 'plezy_adaptive_foreground.svg')):
                  raise SystemExit(f'Legacy Flutter logo is still bundled in {apk}')
              if any(p.startswith(flutter_assets + 'app_icons/previews/') for p in packaged):
                  raise SystemExit(f'Legacy launcher previews are still bundled in {apk}')
              if any(p.startswith('res/') and p.rsplit('/', 1)[-1].startswith(('ic_launcher', 'tv_banner'))
                     for p in packaged):
                  raise SystemExit(f'Legacy Android launcher resource is still bundled in {apk}')
              aliases = manifest.findall('application/activity-alias')
              if len(aliases) != 1 or not aliases[0].get(android + 'name', '').endswith('.MainActivity'):
                  raise SystemExit(f'Expected only the default launcher alias in {apk}')
              categories = {c.get(android + 'name') for c in aliases[0].findall('intent-filter/category')}
              if not {'android.intent.category.LAUNCHER', 'android.intent.category.LEANBACK_LAUNCHER'} <= categories:
                  raise SystemExit(f'Default launcher is missing handheld or TV support in {apk}')
              permissions = {p.get(android + 'name') for p in manifest.findall('uses-permission')}
              providers = [p for p in manifest.findall('application/provider')
                           if p.get(android + 'authorities') == app_id + '.updates']
              if manifest.get(android + 'versionName') != '2.26.0':
                  raise SystemExit(f'Unexpected Android version name in {apk}')
              if manifest.get(android + 'versionCode') != expected_codes[abi]:
                  raise SystemExit(f'Unexpected Android version code in {apk}')
              schemes = {entry.get(android + 'scheme') for entry in manifest.findall('.//intent-filter/data')}
              if 'sundockmedia' not in schemes or 'plezy' in schemes:
                  raise SystemExit(f'Unexpected Android URI scheme in {apk}')
              if manifest.find('application').get(android + 'label') != 'autoPlez':
                  raise SystemExit(f'Unexpected Android app label in {apk}')
              if manifest.get('package') != app_id:
                  raise SystemExit(f'Unexpected Android app ID in {apk}')
              if 'android.permission.REQUEST_INSTALL_PACKAGES' not in permissions:
                  raise SystemExit(f'Missing updater installation permission in {apk}')
              authorities = {p.get(android + 'authorities', '')
                             for p in manifest.findall('application/provider')}
              if not {app_id + '.fileprovider', app_id + '.systemshelf.artwork'} <= authorities:
                  raise SystemExit(f'Missing independent Android provider authority in {apk}')
              if any(part.startswith('com.edde746.plezy.') for a in authorities for part in a.split(';')):
                  raise SystemExit(f'Legacy provider authority prevents side-by-side installation in {apk}')
              if (len(providers) != 1 or providers[0].get(android + 'exported') != 'false'
                      or providers[0].get(android + 'grantUriPermissions') != 'true'):
                  raise SystemExit(f'Missing or invalid updater file provider in {apk}')
              name = f'autoplez-android-{abi}.apk'
              with apk.open('rb') as package:
                  digest = hashlib.file_digest(package, 'sha256').hexdigest()
              rehearsal_assets.append({
                  'name': name,
                  'size': apk.stat().st_size,
                  'digest': 'sha256:' + digest,
                  'browser_download_url': f'https://github.com/Maikel-J/sundock-media/releases/download/v2.26.0-test/{name}',
              })
              print(f'Verified {apk}: {app_id}, installer permission, and private updater file provider')
          target = Path(os.environ['RUNNER_TEMP']) / 'autoplez-rehearsal-assets.json'
          target.write_text(json.dumps({'assets': rehearsal_assets}))
          PY

      - name: Verify the actual APK metadata against the autoPlez updater
        run: |
          AUTOPLEZ_REHEARSAL_ASSET_JSON="$RUNNER_TEMP/autoplez-rehearsal-assets.json" \
            flutter test test/services/android_update_service_test.dart


      - name: Verify source snapshot matches the exact built commit without uploading
        env:
          BUILD_SOURCE_SHA: ${{ steps.rebrand_source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SOURCE_SHA"
          git diff --exit-code HEAD --
          # Do not silently omit any submodule trees from the snapshot.
          if git ls-tree -r HEAD | grep '^160000 ' > "$RUNNER_TEMP/autoplez-submodules"; then
            cat "$RUNNER_TEMP/autoplez-submodules"
            exit 1
          fi
          archive="$RUNNER_TEMP/autoplez-rehearsal-src.tar"
          trap 'rm -f "$archive"' EXIT
          git archive --format=tar --output="$archive" "$BUILD_SOURCE_SHA"
          test "$(git get-tar-commit-id < "$archive")" = "$BUILD_SOURCE_SHA"
          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys
          import tarfile

          required = (
              'LICENSE', 'pubspec.yaml', 'pubspec.lock', 'scripts/codegen.sh',
              'lib/i18n/strings_en.g.dart', 'lib/services/android_update_service.dart',
              'assets/sundock_brand.svg', 'android/app/build.gradle.kts',
              'scripts/release/rehearsal/apply_sundock_identity.py',
              'scripts/release/rehearsal/plezy-rehearsal.py',
              'scripts/release/rehearsal/autoplez-rehearsal-workflow.yml',
          )
          with tarfile.open(sys.argv[1], 'r:') as archive:
              for name in required:
                  member = archive.extractfile(name)
                  if member is None or member.read() != Path(name).read_bytes():
                      raise SystemExit(f'Source archive content differs: {name}')
          print('Verified exact unsigned build source snapshot and controlling scripts; nothing uploaded')
          PY

      - name: Run full Android JVM suite
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2/
        run: |
          set -euo pipefail
          if ! ./gradlew :app:testDebugUnitTest :saf_util:testDebugUnitTest :libass:testDebugUnitTest -x :app:compileFlutterBuildDebug --continue; then
            python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          reports = pathlib.Path('../build').glob('*/test-results/testDebugUnitTest/TEST-*.xml')
          for report in reports:
              suite = ET.parse(report).getroot()
              for case in suite.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(case.get('classname'), case.get('name'))
                      print((failure.text or failure.get('message') or '')[:4500])
          PY
            exit 1
          fi
