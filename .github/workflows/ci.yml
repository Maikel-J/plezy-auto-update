name: Android CI

# FORK POLICY: This maintained fork validates Android only. Do not re-add iOS,
# macOS, Linux, Windows, web, desktop packaging, or other platform CI jobs here.
# Shared codegen stays because the Android app depends on generated Dart source.
# Whole-repository analysis and all-locale translation hygiene are intentionally
# omitted because they can fail on non-Android concerns in this Android-only fork.

on:
  push:
    branches: [main]
  # Keep untrusted code on the read-only pull_request event. Never use pull_request_target here.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  android-ci:
    name: Android release checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-android-pub-v1-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-gradle-v1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v1-

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Verify generated source required by Android
        run: scripts/codegen.sh --check

      - name: Run Android updater Dart tests
        run: flutter test test/services/android_update_service_test.dart test/services/update_service_test.dart

      - name: Configure Android local properties
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties

      - name: Configure Android host native tests
        run: cmake -S android/app/src/test/cpp -B build/android-host-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build and run Android host native tests
        run: |
          cmake --build build/android-host-tests --parallel 2
          ctest --test-dir build/android-host-tests --output-on-failure --no-tests=error

      - name: Run Android JVM unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :saf_util:testDebugUnitTest :libass:testDebugUnitTest -x :app:compileFlutterBuildDebug --continue

      - name: Check Android API compatibility
        working-directory: android
        run: ./gradlew :app:lintDebug
