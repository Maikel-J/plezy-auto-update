name: Upstream Android Releases
run-name: Android release with in-app updater

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-android.yml'
      - 'scripts/release/upstream_android.py'
      - 'scripts/release/ensure_gpl_release.py'
      - 'FORK_NOTICE.md'

permissions:
  contents: read

concurrency:
  group: upstream-android-release
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'Maikel-J/plezy-auto-update' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout maintained fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize GPL and source notices on existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/ensure_gpl_release.py

  build:
    if: github.repository == 'Maikel-J/plezy-auto-update' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.discover.outputs.pending }}
    steps:
      - name: Checkout maintained fork without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize temporary release paths
        run: |
          echo "RELEASE_PLAN=$RUNNER_TEMP/android-release-plan.json" >> "$GITHUB_ENV"
          echo "RELEASE_ASSETS=$RUNNER_TEMP/android-release-unsigned" >> "$GITHUB_ENV"

      - name: Discover next unpublished stable upstream release
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/upstream_android.py discover --plan "$RELEASE_PLAN"

      - name: Prepare source while preserving the Android updater
        id: prepare
        if: steps.discover.outputs.pending == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/release/upstream_android.py "$RUNNER_TEMP/upstream_android.py"
          python3 "$RUNNER_TEMP/upstream_android.py" prepare --plan "$RELEASE_PLAN"

      - name: Setup Java
        if: steps.discover.outputs.pending == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        if: steps.discover.outputs.pending == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.prepare.outputs.flutter_version }}
          cache: true
          pub-cache: false

      - name: Install locked dependencies and regenerate source
        if: steps.discover.outputs.pending == 'true'
        run: |
          flutter pub get --enforce-lockfile --no-example
          scripts/codegen.sh
          git diff -- lib/i18n/strings_en.g.dart
          python3 "$RUNNER_TEMP/upstream_android.py" commit-source --plan "$RELEASE_PLAN"

      - name: Validate generated code, Dart tests, and analysis
        if: steps.discover.outputs.pending == 'true'
        run: |
          scripts/codegen.sh --check
          flutter test test/services/android_update_service_test.dart test/services/update_service_test.dart
          flutter analyze --no-pub

      - name: Validate Android update bridge and manifests
        if: steps.discover.outputs.pending == 'true'
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
          cd android
          ./gradlew :app:testDebugUnitTest --tests 'com.edde746.plezy.AppUpdateChannelTest' -x :app:compileFlutterBuildDebug

      - name: Build APKs without release signing credentials
        if: steps.discover.outputs.pending == 'true'
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --dart-define=ENABLE_UPDATE_CHECK=true \
            --dart-define=ANDROID_UPDATE_REPOSITORY="$GITHUB_REPOSITORY" \
            --dart-define=GIT_COMMIT="$(git rev-parse HEAD)"
          mkdir -p "$RELEASE_ASSETS"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$RELEASE_ASSETS/plezy-android-$abi-unsigned.apk"
          done
          cp "$RELEASE_PLAN" "$RELEASE_ASSETS/upstream-release.json"
          git bundle create "$RELEASE_ASSETS/source.bundle" HEAD
          test -s "$RELEASE_ASSETS/source.bundle"

      - name: Preserve unsigned build inputs
        if: success() && steps.discover.outputs.pending == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-android-unsigned
          path: ${{ runner.temp }}/android-release-unsigned
          if-no-files-found: error

  sign:
    needs: build
    if: needs.build.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download unsigned build inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-android-unsigned
          path: ${{ runner.temp }}/android-release-unsigned

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate unsigned APK identity
        id: plan
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/android-release-unsigned
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          plan = json.loads((Path(os.environ['RELEASE_ASSETS']) / 'upstream-release.json').read_text())
          if plan.get('repository') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Release plan repository mismatch')
          if plan.get('upstream_repository') != 'edde746/plezy':
              raise SystemExit('Release plan upstream mismatch')
          version = plan.get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release version')
          build = plan.get('build_number')
          if not isinstance(build, int) or build <= 0:
              raise SystemExit('Invalid Android build number')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as stream:
              stream.write(f'version={version}\n')
              stream.write(f'build_number={build}\n')
          PY
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$RELEASE_ASSETS/plezy-android-$abi-unsigned.apk"
            test -s "$apk"
            test "$("$APKANALYZER" manifest application-id "$apk")" = 'com.edde746.plezy'
            test "$("$APKANALYZER" manifest version-name "$apk")" = '${{ steps.plan.outputs.version }}'
            test "$("$APKANALYZER" manifest version-code "$apk")" = '${{ steps.plan.outputs.build_number }}'
          done

      - name: Sign and verify APKs in isolated step
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/android-release-unsigned
          SIGNED_ASSETS: ${{ runner.temp }}/android-release-signed
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure these repository Actions secrets before publishing: ' + ', '.join(missing))
          key = Path(os.environ['RUNNER_TEMP']) / 'android-release-key.jks'
          key.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
          PY
          mkdir -p "$SIGNED_ASSETS"
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -x "$APKSIGNER"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            input="$RELEASE_ASSETS/plezy-android-$abi-unsigned.apk"
            output="$SIGNED_ASSETS/plezy-android-$abi.apk"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/android-release-key.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_STORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$output" \
              "$input"
            "$APKSIGNER" verify --verbose "$output"
          done
          cp "$RELEASE_ASSETS/upstream-release.json" "$SIGNED_ASSETS/upstream-release.json"
          cp "$RELEASE_ASSETS/source.bundle" "$SIGNED_ASSETS/source.bundle"
          cd "$SIGNED_ASSETS"
          sha256sum plezy-android-*.apk > SHA256SUMS

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release-key.jks"

      - name: Preserve signed release assets
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-android-signed
          path: ${{ runner.temp }}/android-release-signed
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: needs.build.outputs.pending == 'true' && needs.sign.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout trusted maintained-fork revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Preserve trusted publisher scripts
        run: |
          cp scripts/release/upstream_android.py "$RUNNER_TEMP/trusted-upstream_android.py"
          cp scripts/release/ensure_gpl_release.py "$RUNNER_TEMP/trusted-ensure_gpl_release.py"

      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-android-signed
          path: ${{ runner.temp }}/android-release-signed

      - name: Validate release plan and source bundle
        id: plan
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/android-release-signed
        run: |
          set -euo pipefail
          cd "$RELEASE_ASSETS"
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          assets = Path(os.environ['RELEASE_ASSETS'])
          plan = json.loads((assets / 'upstream-release.json').read_text())
          if plan.get('repository') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Release plan repository mismatch')
          if plan.get('upstream_repository') != 'edde746/plezy':
              raise SystemExit('Release plan upstream mismatch')
          version = plan.get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release version')
          upstream_tag = plan.get('upstream_tag', '')
          if upstream_tag not in (version, f'v{version}'):
              raise SystemExit('Upstream tag/version mismatch')
          if plan.get('release_tag') != f'v{version}+android.1':
              raise SystemExit('Unexpected fork release tag')
          if plan.get('upstream_url') != f'https://github.com/edde746/plezy/releases/tag/{upstream_tag}':
              raise SystemExit('Unexpected upstream release URL')
          if not isinstance(plan.get('upstream_release_id'), int) or plan['upstream_release_id'] <= 0:
              raise SystemExit('Invalid upstream release id')
          if not isinstance(plan.get('build_number'), int) or plan['build_number'] <= 0:
              raise SystemExit('Invalid Android build number')
          source = plan.get('source_sha', '')
          if not re.fullmatch(r'[0-9a-f]{40,64}', source):
              raise SystemExit('Invalid source commit id')
          if not (assets / 'source.bundle').is_file() or not (assets / 'source.bundle').stat().st_size:
              raise SystemExit('Missing source bundle')
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              apk = assets / f'plezy-android-{abi}.apk'
              if not apk.is_file() or not apk.stat().st_size:
                  raise SystemExit(f'Missing signed APK for {abi}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'source_sha={source}\n')
          PY
          git fetch "$RELEASE_ASSETS/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = '${{ steps.plan.outputs.source_sha }}'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '${{ steps.plan.outputs.source_sha }}'
          git grep -q 'ANDROID_UPDATE_REPOSITORY' -- lib/services/update_service.dart
          git grep -q 'AndroidUpdateAsset.select' -- lib/services/update_service.dart
          git grep -q 'downloadAndInstall' -- lib/utils/update_dialog.dart
          git grep -q 'appUpdateChannel.attach' -- android/app/src/main/kotlin/com/edde746/plezy/MainActivity.kt
          git grep -q 'SIGNATURE_MISMATCH' -- android/app/src/main/kotlin/com/edde746/plezy/AppUpdateChannel.kt
          git grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' -- android/app/src/sideload/AndroidManifest.xml

      - name: Publish complete signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/android-release-signed
        run: python3 "$RUNNER_TEMP/trusted-upstream_android.py" publish --plan "$RELEASE_ASSETS/upstream-release.json" --assets "$RELEASE_ASSETS"

      - name: Normalize GPL and source notice on published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout --detach "$GITHUB_SHA"
          python3 "$RUNNER_TEMP/trusted-ensure_gpl_release.py"
