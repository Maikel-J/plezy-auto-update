name: Sync Upstream Main
run-name: Merge edde746/plezy main into fork

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Maikel-J/plezy-auto-update' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout maintained fork without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream main without credentials
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/edde746/plezy.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Fork main already contains upstream main.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit upstream/main
          git diff --check HEAD^ HEAD
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push clean merge with short-lived authentication
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          trap 'unset AUTH GITHUB_TOKEN' EXIT
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push https://github.com/${GITHUB_REPOSITORY}.git HEAD:main
