name: Android Build
run-name: Android build ${{ github.sha }}

# FORK POLICY: This maintained fork is Android-only. Do not re-add iOS, macOS,
# Linux, Windows, web, desktop packaging, or non-Android distribution jobs here.
# Upstream platform workflows are intentionally omitted in this fork.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # upstream_android.py reads this pinned SDK version when preparing Android releases.
  FLUTTER_VERSION: "3.47.1"
  TRUSTED_BUILD_CACHE_VERSION: android-only-v1

jobs:
  build-android:
    if: github.repository == 'Maikel-J/plezy-auto-update' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout maintained fork without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Verify generated source
        run: scripts/codegen.sh --check

      - name: Run Android updater tests
        run: flutter test test/services/android_update_service_test.dart test/services/update_service_test.dart

      - name: Validate Android JVM tests and API compatibility
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
          cd android
          ./gradlew :app:testDebugUnitTest :saf_util:testDebugUnitTest :libass:testDebugUnitTest -x :app:compileFlutterBuildDebug --continue
          ./gradlew :app:lintDebug

      - name: Build Android APKs without release signing secrets
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ENABLE_UPDATE_CHECK=true \
            --dart-define=ANDROID_UPDATE_REPOSITORY="$GITHUB_REPOSITORY" \
            --dart-define=GIT_COMMIT="$GITHUB_SHA"
          mkdir -p android-artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android-artifacts/plezy-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android-artifacts/plezy-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk android-artifacts/plezy-android-x86_64.apk

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: android-artifacts
          if-no-files-found: error
